name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Restore .NET solution
        run: dotnet restore Monitoring.slnx

      - name: Build .NET solution
        run: dotnet build Monitoring.slnx --no-restore --configuration Release

      - name: Run backend tests
        run: dotnet test tests/Monitoring.Tests/Monitoring.Tests.csproj --no-build --configuration Release

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Run frontend tests
        working-directory: client
        run: npm test

      - name: Build frontend
        working-directory: client
        run: npm run build
