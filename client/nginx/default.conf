map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- Served by the API container ----
    location /api/ {
        proxy_pass http://api:8080;
        include /etc/nginx/proxy.conf;
    }

    # SignalR (WebSockets, with long-polling fallback)
    location /hubs/ {
        proxy_pass http://api:8080;
        include /etc/nginx/proxy.conf;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location ~ ^/(hangfire|swagger|openapi|health) {
        proxy_pass http://api:8080;
        include /etc/nginx/proxy.conf;
    }

    # ---- The React app ----
    location /assets/ {
        expires 1y;                       # hashed file names: safe to cache forever
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri /index.html;       # client-side routing
    }
}